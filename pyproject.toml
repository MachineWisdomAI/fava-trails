[project]
name = "fava-trails"
version = "0.6.1"
description = "FAVA Trails 🫛👣 — Federated Agents Versioned Audit Trail. VCS-backed memory for AI agents via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Machine Wisdom Solutions Inc."}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "mcp>=1.28.1,<2.0",
    "pydantic>=2.0.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-ulid>=3.0.0,<4.0",
    "any-llm-sdk>=1.10.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.41.0,<1.0",
]

[project.optional-dependencies]
bedrock   = ["any-llm-sdk[bedrock]>=1.10.0,<2.0"]
groq      = ["any-llm-sdk[groq]>=1.10.0,<2.0"]
anthropic = ["any-llm-sdk[anthropic]>=1.10.0,<2.0"]
gemini    = ["any-llm-sdk[gemini]>=1.10.0,<2.0"]
mistral   = ["any-llm-sdk[mistral]>=1.10.0,<2.0"]
ollama    = ["any-llm-sdk[ollama]>=1.10.0,<2.0"]
# Protocol extras: lightweight protocols (1-2 deps) live here as extras.
# Protocols with heavy dependency trees must be UV workspace members instead.
secom     = ["llmlingua>=0.2.0,<1.0"]
all       = ["any-llm-sdk[bedrock,groq,anthropic,gemini,mistral,ollama]>=1.10.0,<2.0", "llmlingua>=0.2.0,<1.0"]

[project.urls]
Homepage = "https://github.com/MachineWisdomAI/fava-trails"
Repository = "https://github.com/MachineWisdomAI/fava-trails"
Issues = "https://github.com/MachineWisdomAI/fava-trails/issues"

[project.scripts]
fava-trails-server = "fava_trails.server:run"
fava-trails = "fava_trails.cli:main"
fava-trails-tunnel = "fava_trails.tunnel_cli:main"

[build-system]
requires = ["hatchling>=1.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fava_trails"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fava_trails/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "AGENTS_USAGE_INSTRUCTIONS.md",
]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS_USAGE_INSTRUCTIONS.md" = "fava_trails/AGENTS_USAGE_INSTRUCTIONS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "ruff>=0.8.0,<1.0",
]
